<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Политика конфиденциальности — Я никогда не…</title>
  <meta name="description" content="Политика конфиденциальности приложения «Я никогда не…» на восьми языках.">
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f0c29;
      --ink: #f4f1ff;
      --muted: rgba(244, 241, 255, 0.72);
      --line: rgba(255, 255, 255, 0.12);
      --accent: #ff4b5c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 17px/1.55 Georgia, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
    }
    main {
      max-width: 42rem;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }
    header {
      margin-bottom: 2rem;
      padding-bottom: 1.25rem;
      border-bottom: 1px solid var(--line);
    }
    .stamp {
      display: inline-block;
      margin: 0 0 1rem;
      padding: 0.2rem 0.55rem;
      border: 2px solid var(--accent);
      color: var(--accent);
      font: 700 0.72rem/1.3 system-ui, sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transform: rotate(-6deg);
    }
    h1 {
      margin: 0;
      font-size: 2rem;
      line-height: 1.15;
      letter-spacing: -0.03em;
    }
    .meta {
      margin: 0.75rem 0 0;
      color: var(--muted);
      font: 0.95rem/1.4 system-ui, sans-serif;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem 0.9rem;
      margin-top: 1rem;
      font: 0.9rem/1.3 system-ui, sans-serif;
    }
    a { color: #ffb3ba; }
    nav span[aria-current="page"] { color: var(--ink); font-weight: 700; }
    h2 {
      margin: 2rem 0 0.6rem;
      font-size: 1.25rem;
      line-height: 1.3;
    }
    p { color: var(--ink); }
    .choices {
      list-style: none;
      padding: 0;
      margin: 1.5rem 0 0;
    }
    .choices a {
      display: block;
      margin-top: 0.75rem;
      padding: 0.9rem 1rem;
      border: 1px solid var(--line);
      border-radius: 12px;
      text-decoration: none;
      font: 600 1.05rem/1.3 system-ui, sans-serif;
    }
    footer {
      margin-top: 2.5rem;
      color: var(--muted);
      font: 0.9rem/1.45 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="stamp">18+</div>
      <h1>Политика конфиденциальности</h1>
      <p class="meta">«Я никогда не…» / Never Have I Ever. Один язык — один файл.</p>
    </header>
    <ul class="choices">
      <li><a href="cs.html" hreflang="cs">Čeština</a></li>
      <li><a href="de.html" hreflang="de">Deutsch</a></li>
      <li><a href="en.html" hreflang="en">English</a></li>
      <li><a href="es.html" hreflang="es">Español</a></li>
      <li><a href="fr.html" hreflang="fr">Français</a></li>
      <li><a href="pl.html" hreflang="pl">Polski</a></li>
      <li><a href="ru.html" hreflang="ru">Русский</a></li>
      <li><a href="uk.html" hreflang="uk">Українська</a></li>
    </ul>
    <footer>© 2026 «Я никогда не…» / Never Have I Ever</footer>
  </main>
</body>
</html>
